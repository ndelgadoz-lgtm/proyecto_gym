<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E">
  <title>Gym · Registro de entrenos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar" class="hidden">
    <h1 id="view-title">Gym</h1>
    <div class="user-chip">
      <img id="avatar" alt="" class="avatar hidden">
      <button id="btn-logout" class="small-btn">Salir</button>
    </div>
  </header>

  <main id="app">
    <section id="view-login" class="view">
      <div class="login-box">
        <div class="logo">🏋️</div>
        <h2>Mi Entrenamiento</h2>
        <p class="muted">Registra tus series, kg y reps de cada microciclo.</p>
        <div id="gbtn"></div>
        <p id="login-error" class="error hidden"></p>
      </div>
    </section>

    <section id="view-app" class="view hidden">
      <div class="home-head">
        <span id="hello" class="muted"></span>
        <span id="current-badge" class="badge hidden"></span>
      </div>

      <div id="trainer-tabs" class="trainer-tabs"></div>
      <div id="week-strip" class="week-strip"></div>
      <div id="week-content"></div>
    </section>
  </main>

  <div id="toast" class="hidden"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
